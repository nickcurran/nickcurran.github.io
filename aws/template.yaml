AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Proxies the Gracenote/TMS movies API so the API key never reaches the browser.
  See docs/plans/hardening.md for the full plan.

Parameters:
  TmsApiKey:
    Type: String
    NoEcho: true
    Description: Gracenote/TMS API key, passed at deploy time. Never commit this.
  AllowedOrigin:
    Type: String
    Default: https://tcob.com
    Description: Production origin allowed to call this function (CORS).

Resources:
  MoviesProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tcob-movies-proxy
      CodeUri: handler/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          TMS_API_KEY: !Ref TmsApiKey
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
            - http://localhost:3000
          AllowMethods:
            - GET
          MaxAge: 300

  # Caches successful responses at the edge, keyed by (zip, radius, startDate), so repeat
  # lookups for the same day/area are served without invoking the Lambda or calling TMS again.
  MoviesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-movies-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Origin
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - zip
              - radius
              - startDate

  MoviesCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Edge cache for ${AWS::StackName} movies proxy'
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: MoviesProxyOrigin
            DomainName: !Select [2, !Split ['/', !GetAtt MoviesProxyFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: MoviesProxyOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !Ref MoviesCachePolicy

Outputs:
  FunctionUrl:
    Description: Public URL for the movies proxy (bypasses the CloudFront cache; for testing)
    Value: !GetAtt MoviesProxyFunctionUrl.FunctionUrl
  CdnDomainName:
    Description: CloudFront domain the browser should call instead of the raw Function URL
    Value: !GetAtt MoviesCdn.DomainName
